name: Release

# GitHub でリリースを公開すると、Windows 用の zip を作って添付する。
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --solution Abbild.slnx -c Release
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/Abbild -c Release -r win-x64 --self-contained true `
            -p:Version=$version -p:DebugType=none -o publish/Abbild
          Copy-Item THIRD_PARTY_NOTICES.md publish/Abbild/
          Compress-Archive -Path publish/Abbild -DestinationPath "Abbild-$version-win-x64.zip"
      - name: Upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem Abbild-*.zip).FullName
          gh release upload "${{ github.ref_name }}" $zip --clobber
