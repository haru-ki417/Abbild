    <meta name="theme-color" content="#0b0d18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="stylesheet" href="css/app.css" />

<body>
    <div id="app"></div>

    <!-- 読み込み中・はじめる -->
    <div id="loading">
        <img class="load-icon" src="icons/icon-192.png" alt="" />
        <div class="load-title">Abbild</div>
        <div class="load-sub">～ 古の迷宮と勇者の魂 ～</div>
        <div class="load-bar"><span id="load-bar"></span></div>
        <div class="load-text" id="load-text">ゲームを読み込んでいます…</div>
        <button id="start" class="start" hidden>はじめる</button>
        <div class="load-help">
            <div class="help-keys"><b>キーボード</b>　↑↓←→ / WASD で選ぶ・Z / Enter で決定・X で戻る・C で息・Esc でメニュー</div>
            <div class="help-keys"><b>ゲームパッド</b>　十字キー・A 決定・B 戻る・Y 息・START メニュー</div>
            <div class="help-keys"><b>スマホ・タブレット</b>　画面の十字キーとボタン（横向きがおすすめ）</div>
            <div class="note">セーブはこのブラウザーの中だけに残ります。BGM はブラウザー版には入っていません（効果音はあります）。</div>
        </div>
        <noscript><p>このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
    </div>

    <!-- 画面のボタン（タッチの端末） -->
    <div id="touch-ui" aria-hidden="true">
        <div id="pad" class="pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
        <div class="buttons">
            <button class="tbtn menu" data-act="menu">メニュー</button>
            <button class="tbtn breath" data-act="breath">息</button>
            <button class="tbtn cancel" data-act="cancel">もどる</button>
            <button class="tbtn confirm" data-act="confirm">決定</button>
        </div>
    </div>
    <button id="touch-toggle" class="touch-toggle" title="画面のボタンを出す・隠す">⌨︎</button>

    <div id="blazor-error-ui" role="alert">
        問題が起きました。<a href="" class="reload">読み込み直す</a>
        <a class="dismiss" aria-label="閉じる">✕</a>
    </div>

    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js" autostart="false"></script>
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>

    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>
    <script src="js/host.js"></script>
    <!-- Blazor の起動は、ほかのスクリプト（KNI・host.js）を読み込んだ後に行う -->
    <script src="js/boot.js"></script>
</body>
</html>
